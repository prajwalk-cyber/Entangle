# AGGRESSIVE MEMORY OPTIMIZATION FOR 4GB RAM SYSTEMS
# --------------------------------------------------

# Limit Gradle memory to 1024MB. 2048MB was too much for this system.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8

# Disable the daemon to free up RAM between builds
org.gradle.daemon=false

# Run Kotlin compiler in the same process to avoid starting another memory-heavy daemon
kotlin.compiler.execution.strategy=in-process

# Limit Kotlin daemon memory just in case it starts
kotlin.daemon.jvmargs=-Xmx512m

# Faster parallel builds use more RAM, so we keep single-threaded
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=true

# Force Dexing to stay within the same process to save overhead
android.dexqx.in-process=true
android.debug.support.multidex=true


# Standard Android settings
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Disable resource shrinking/unused features during debug build to save RAM
android.enableR8.fullMode=false